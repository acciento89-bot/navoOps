name: iOS CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Validate privacy manifest
        run: plutil -lint NavoOps/Resources/PrivacyInfo.xcprivacy

      - name: Generate app icon
        run: xcrun swift scripts/generate_app_icon.swift

      - name: Verify opaque 1024px app icon
        run: |
          test -s NavoOps/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          WIDTH=$(sips -g pixelWidth NavoOps/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png | awk '/pixelWidth/ {print $2}')
          HEIGHT=$(sips -g pixelHeight NavoOps/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png | awk '/pixelHeight/ {print $2}')
          ALPHA=$(sips -g hasAlpha NavoOps/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png | awk '/hasAlpha/ {print $2}')
          test "$WIDTH" = "1024"
          test "$HEIGHT" = "1024"
          test "$ALPHA" = "no"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for devices in data["devices"].values() for device in devices if device.get("isAvailable") and device.get("name", "").startswith("iPhone")))')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          xcodebuild \
            -project NavoOps.xcodeproj \
            -scheme NavoOps \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            test

name: NavoOps

options:
  bundleIdPrefix: com.kamilunavo
  deploymentTarget:
    iOS: '17.0'

settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    CURRENT_PROJECT_VERSION: 5
    MARKETING_VERSION: 1.3.0
    DEVELOPMENT_TEAM: TKG684N5GL
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

schemes:
  NavoOps:
    build:
      targets:
        NavoOps: all
    test:
      targets:
        - NavoOpsTests

targets:
  NavoOps:
    type: application
    platform: iOS
    sources:
      - path: NavoOps
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kamilunavo.NavoOps
        PRODUCT_NAME: NavoOps
        INFOPLIST_FILE: NavoOps/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    preBuildScripts:
      - name: Generate deterministic App Icon
        script: |
          /usr/bin/env -u SDKROOT -u IPHONEOS_DEPLOYMENT_TARGET -u PLATFORM_NAME -u EFFECTIVE_PLATFORM_NAME /usr/bin/xcrun --sdk macosx swift "$SRCROOT/scripts/generate_app_icon.swift"

  NavoOpsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NavoOpsTests
    dependencies:
      - target: NavoOps
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kamilunavo.NavoOpsTests
        CODE_SIGNING_ALLOWED: NO

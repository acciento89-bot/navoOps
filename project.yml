name: NavoOps
options:
  bundleIdPrefix: com.kamilunavo
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: 5.10
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  NavoOps:
    type: application
    platform: iOS
    sources:
      - NavoOps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kamilunavo.NavoOps
        PRODUCT_NAME: NavoOps
        INFOPLIST_KEY_CFBundleDisplayName: NavoOps
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []
